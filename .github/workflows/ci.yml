name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@v1
    with:
      project_type: "ha-integration"
    secrets: inherit
